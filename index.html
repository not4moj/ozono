<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EcoAdvance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F2430;
  --deep:#0A4C6A;
  --cyan:#0EA5C4;
  --leaf:#4C9A5B;
  --mist:#F4F9FA;
  --paper:#FFFFFF;
  --line:#DCEAEC;
  --muted:#5B7480;
  font-size:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EAF3F5; --paper:#0E2027; --mist:#0B1A20; --line:#1E3A42; --muted:#9FB6BE;
  }
}
:root[data-theme="dark"]{
  --ink:#EAF3F5; --paper:#0E2027; --mist:#0B1A20; --line:#1E3A42; --muted:#9FB6BE;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
body{
  font-family:"Outfit",sans-serif;
  background:var(--mist);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100%;
}
body.lang-ar{font-family:"Tajawal",sans-serif}
img{max-width:100%;display:block}
button,input{font-family:inherit}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 clamp(20px,5vw,48px)}

/* ---------- Language gate ---------- */
#gate{
  min-height:100svh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(28px,6vh,56px);
  background:
    radial-gradient(60% 50% at 20% 15%, rgba(14,165,196,.16), transparent 60%),
    radial-gradient(55% 45% at 85% 85%, rgba(76,154,91,.14), transparent 60%),
    var(--deep);
  color:#EAF6F8;
  text-align:center;
  padding:32px 20px;
  position:relative;
  overflow:hidden;
}
#gate .bubbles{position:absolute;inset:0;pointer-events:none}
#gate .bubbles span{
  position:absolute;bottom:-10%;
  width:var(--s);height:var(--s);
  border-radius:50%;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);
  animation:rise var(--d) linear infinite;
  animation-delay:var(--delay);
  left:var(--l);
}
@keyframes rise{
  to{transform:translateY(-120svh)}
}
@media (prefers-reduced-motion: reduce){
  #gate .bubbles span{animation:none;display:none}
}
.brand{display:flex;align-items:center;gap:12px;justify-content:center}
.brand svg{width:38px;height:38px;flex:none}
.brand-name{font-weight:700;font-size:1.5rem;letter-spacing:.01em}
.brand-name b{color:var(--cyan);font-weight:700}
#gate h1{
  font-size:clamp(1.5rem,3.2vw,2.1rem);
  font-weight:500;
  margin:0;
  color:#CDE9EE;
  max-width:26ch;
}
.langs{
  display:flex;flex-wrap:wrap;gap:14px;justify-content:center;
  position:relative;z-index:1;
}
.lang-btn{
  appearance:none;border:1.5px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.06);
  color:#fff;
  padding:16px 30px;
  border-radius:3px;
  font-size:1.05rem;
  font-weight:500;
  cursor:pointer;
  transition:background .15s ease, border-color .15s ease, transform .15s ease;
  min-width:150px;
}
.lang-btn:hover{background:rgba(255,255,255,.14);border-color:#fff}
.lang-btn:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.lang-btn:active{transform:scale(.98)}
.lang-btn .native{display:block;font-size:1.05rem}
.lang-btn .sub{display:block;font-size:.72rem;letter-spacing:.06em;color:rgba(255,255,255,.55);margin-top:3px;font-weight:400}

/* ---------- Site ---------- */
#site{display:none}
#site.show{display:block}
#gate.hide{display:none}

header.top{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  top:env(safe-area-inset-top,0px);
}
header.top .row{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px clamp(20px,5vw,48px);
  max-width:1100px;margin:0 auto;
}
.switcher{display:flex;gap:4px}
.switcher button{
  background:none;border:none;color:var(--muted);font-size:.82rem;
  padding:6px 8px;cursor:pointer;border-radius:4px;font-weight:500;
}
.switcher button[aria-current="true"]{color:var(--deep);background:var(--mist)}

.hero{padding:clamp(40px,8vh,86px) 0 clamp(30px,6vh,60px)}
.hero .grid{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(24px,5vw,64px);align-items:stretch}
@media (max-width:820px){.hero .grid{grid-template-columns:1fr}}
.eyebrow-free{margin:0 0 14px}
.hero h1{
  font-size:clamp(2rem,4.6vw,3.15rem);
  line-height:1.08;
  font-weight:700;
  margin:0 0 18px;
  color:var(--deep);
  letter-spacing:-0.01em;
}
:root[data-theme="dark"] .hero h1, body.lang-ar[data-theme="dark"] .hero h1{color:#8FDCEE}
.hero p.lead{font-size:1.12rem;line-height:1.6;color:var(--muted);max-width:46ch;margin:0 0 30px}
.cta-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.btn{
  display:inline-flex;align-items:center;gap:10px;
  padding:15px 28px;border-radius:3px;border:none;
  font-size:1rem;font-weight:600;cursor:pointer;text-decoration:none;
}
.btn-primary{background:var(--cyan);color:#04222B}
.btn-primary:hover{background:#12b7d8}
.btn-ghost{background:none;color:var(--deep);border:1.5px solid var(--line)}
:root[data-theme="dark"] .btn-ghost{color:#EAF3F5}
.btn-ghost:hover{border-color:var(--cyan)}
.hero-art{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(28px,6vh,52px);min-height:100%;padding-top:clamp(50px,11vh,120px)}
@media (max-width:820px){.hero-art{padding-top:0}}
.hero-art .glow{
  position:absolute;inset:-10%;
  background:radial-gradient(50% 50% at 50% 50%, rgba(14,165,196,.25), transparent 70%);
  z-index:0;
}
.hero-art img{position:relative;z-index:1}

.strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:clamp(28px,5vh,48px) 0;background:var(--paper)}
.strip .items{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
@media (max-width:820px){.strip .items{grid-template-columns:1fr;gap:22px}}
.strip .item{
  display:flex;gap:12px;align-items:flex-start;
  padding:0 22px;
  border-inline-start:1px solid var(--line);
}
.strip .items .item:first-child{border-inline-start:none}
@media (max-width:820px){.strip .item{border-inline-start:none;padding:0}}
.strip .item svg{flex:none;width:26px;height:26px;color:var(--leaf);margin-top:2px}
.strip .item p{margin:0;font-size:.95rem;line-height:1.45;color:var(--ink)}
.strip .item p b{display:block;font-weight:600;margin-bottom:3px}

.how{padding:clamp(56px,9vh,96px) 0}
.how h2{font-size:clamp(1.5rem,3vw,2rem);font-weight:700;color:var(--deep);margin:0 0 40px;max-width:22ch}
:root[data-theme="dark"] .how h2{color:#8FDCEE}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
@media (max-width:820px){.steps{grid-template-columns:1fr;gap:28px}}
.step{position:relative;padding-inline-start:52px}
.step .num{
  position:absolute;inset-inline-start:0;top:-2px;
  width:36px;height:36px;border-radius:50%;
  background:var(--deep);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:1rem;
}
.step h3{margin:0 0 6px;font-size:1.05rem;font-weight:600}
.step p{margin:0;color:var(--muted);font-size:.94rem;line-height:1.5}

.order{background:var(--deep);color:#EAF6F8;padding:clamp(56px,9vh,100px) 0}
.order .grid{display:grid;grid-template-columns:1fr 1fr;gap:48px}
@media (max-width:820px){.order .grid{grid-template-columns:1fr}}
.order-modes{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 20px;direction:ltr}
[dir="rtl"] .order-modes{justify-content:flex-end}
.order-mode-btn{
  appearance:none;cursor:pointer;
  padding:10px 20px;border-radius:999px;
  border:1.5px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.06);
  color:#EAF6F8;font-size:.9rem;font-weight:600;
  transition:background .18s ease, border-color .18s ease, color .18s ease;
}
.order-mode-btn:hover{background:rgba(255,255,255,.14);border-color:#fff}
.order-mode-btn.active{background:var(--cyan);border-color:var(--cyan);color:#04222B}
.trial-callout{
  display:inline-flex;align-items:center;gap:5px;
  color:#FFD966;font-weight:800;font-size:.82rem;
  white-space:nowrap;
  animation:trialCalloutBounce 1.5s ease-in-out infinite;
}
.trial-callout-arrow{
  font-size:1.15rem;line-height:1;display:inline-block;
  animation:trialArrowNudge 1.5s ease-in-out infinite;
}
@keyframes trialCalloutBounce{
  0%,100%{opacity:.85}
  50%{opacity:1}
}
@keyframes trialArrowNudge{
  0%,100%{transform:translateX(0)}
  50%{transform:translateX(-5px)}
}
@media (prefers-reduced-motion: reduce){
  .trial-callout, .trial-callout-arrow{animation:none}
}
@media (max-width:520px){
  .trial-callout{flex-basis:100%;margin-top:2px}
}
.order h2{font-size:clamp(1.5rem,3vw,2rem);font-weight:700;margin:0 0 14px}
.order p.copy{color:#BFE0E7;line-height:1.6;max-width:42ch;margin:0 0 24px}
.order .direct{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.order .direct a{
  color:#EAF6F8;text-decoration:none;font-size:.95rem;
  border-bottom:1px solid rgba(255,255,255,.3);
  padding-bottom:2px;width:fit-content;
}
form{background:var(--paper);border-radius:6px;padding:clamp(24px,4vw,36px);color:var(--ink)}
.field{margin-bottom:16px}
.field label{display:block;font-size:.82rem;font-weight:600;margin-bottom:6px;color:var(--muted)}
.field input,.field select{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:4px;
  font-size:.98rem;background:var(--paper);color:var(--ink);
}
.field input:focus,.field select:focus{outline:2px solid var(--cyan);outline-offset:1px;border-color:var(--cyan)}
.field-check{margin-bottom:20px}
.check-label{
  display:flex;align-items:flex-start;gap:10px;cursor:pointer;
  font-size:.88rem;line-height:1.4;color:var(--ink);
}
.check-label input[type="checkbox"]{
  flex:none;width:19px;height:19px;margin-top:1px;accent-color:var(--cyan);cursor:pointer;
}
form .btn-primary{width:100%;justify-content:center;margin-top:6px}
.confirm{display:none;text-align:center;padding:20px 6px}
.confirm.show{display:block}
form.sent .fields-block{display:none}
.confirm svg{width:40px;height:40px;color:var(--leaf);margin:0 auto 12px;display:block}
.confirm h3{margin:0 0 8px;font-size:1.15rem}
.confirm p{margin:0;color:var(--muted);font-size:.92rem}

footer{padding:32px 0 calc(32px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
footer .row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
footer .brand-name{font-size:1rem}
footer .switcher button{color:var(--muted)}
footer p.fine{margin:0;color:var(--muted);font-size:.8rem}

[dir="rtl"] .steps{direction:rtl}

.brochure-btn{
  position:relative;
  z-index:2;
  display:inline-flex;align-items:center;gap:clamp(10px,2vw,14px);
  padding:clamp(16px,2.4vw,22px) clamp(28px,5vw,46px);
  border-radius:999px;
  border:2px solid var(--cyan);
  background:var(--cyan);
  color:#04222B;
  font-size:clamp(1.02rem,1.6vw,1.25rem);
  font-weight:700;
  text-decoration:none;
  cursor:pointer;
  white-space:nowrap;
  transition:background .18s ease, color .18s ease, transform .18s ease, box-shadow .25s ease;
  box-shadow:
    inset 0 0 16px rgba(14,165,196,.28),
    inset 0 0 4px rgba(14,165,196,.4),
    0 0 0 4px rgba(14,165,196,.10),
    0 6px 20px rgba(14,165,196,.28),
    0 0 34px rgba(14,165,196,.35);
  animation:brochureGlow 2.8s ease-in-out infinite;
}
.brochure-btn:hover{
  background:#12b7d8;color:#04222B;transform:translateY(-3px);
  box-shadow:
    inset 0 0 20px rgba(255,255,255,.5),
    0 0 0 6px rgba(14,165,196,.14),
    0 12px 30px rgba(14,165,196,.4),
    0 0 46px rgba(14,165,196,.5);
}
.brochure-btn:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.brochure-btn svg{width:clamp(22px,2.6vw,28px);height:clamp(22px,2.6vw,28px);flex:none;color:#04222B}
@keyframes brochureGlow{
  0%,100%{
    box-shadow:
      inset 0 0 16px rgba(14,165,196,.28),
      inset 0 0 4px rgba(14,165,196,.4),
      0 0 0 4px rgba(14,165,196,.10),
      0 6px 20px rgba(14,165,196,.28),
      0 0 34px rgba(14,165,196,.35);
  }
  50%{
    box-shadow:
      inset 0 0 26px rgba(14,165,196,.42),
      inset 0 0 8px rgba(14,165,196,.55),
      0 0 0 8px rgba(14,165,196,.16),
      0 6px 26px rgba(14,165,196,.4),
      0 0 54px rgba(14,165,196,.55);
  }
}
@media (prefers-reduced-motion: reduce){.brochure-btn{animation:none}}
:root[data-theme="dark"] .brochure-btn{border-color:var(--cyan);color:#04222B;background:var(--cyan)}
:root[data-theme="dark"] .brochure-btn:hover{background:#12b7d8;color:#04222B}
@media (max-width:600px){
  .brochure-btn{white-space:normal;text-align:center}
}

.pdf-modal{
  position:fixed;inset:0;z-index:100;
  opacity:0;visibility:hidden;
  transition:opacity .25s ease, visibility .25s ease;
}
.pdf-modal.open{opacity:1;visibility:visible}
.pdf-modal-backdrop{
  position:absolute;inset:0;
  background:rgba(8,28,38,.6);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.pdf-modal-panel{
  position:relative;z-index:1;
  width:min(94vw,920px);
  height:min(90vh,960px);
  margin:5vh auto 0;
  background:var(--paper);
  border-radius:10px;
  overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 24px 64px rgba(0,0,0,.4);
  transform:translateY(14px) scale(.98);
  transition:transform .25s ease;
}
.pdf-modal.open .pdf-modal-panel{transform:translateY(0) scale(1)}
.pdf-modal-bar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 18px;border-bottom:1px solid var(--line);
  background:var(--paper);flex:none;
}
.pdf-modal-title{font-weight:700;color:var(--deep);font-size:1rem}
:root[data-theme="dark"] .pdf-modal-title{color:#8FDCEE}
.pdf-modal-actions{display:flex;align-items:center;gap:16px}
.pdf-modal-download{color:var(--deep);text-decoration:none;font-size:.9rem;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:1px}
:root[data-theme="dark"] .pdf-modal-download{color:#8FDCEE}
.pdf-modal-close{
  appearance:none;border:none;background:var(--mist);
  width:34px;height:34px;border-radius:50%;flex:none;
  font-size:1.1rem;line-height:1;cursor:pointer;color:var(--ink);
}
.pdf-modal-close:hover{background:var(--line)}
.pdf-modal-body{
  flex:1;overflow:auto;background:var(--mist);
  display:flex;align-items:center;justify-content:center;
  padding:18px;position:relative;
}
.pdf-modal-body canvas{
  background:#fff;
  max-width:100%;height:auto;
  border-radius:3px;
  opacity:0;
  transition:opacity .3s ease;
}
.pdf-modal-body canvas.loaded{opacity:1}
@media (prefers-reduced-motion: reduce){
  .pdf-modal-body canvas{transition:none}
}
.pdf-loading{color:var(--muted);font-size:.92rem;font-weight:500;align-self:center}
.pdf-nav{
  display:flex;align-items:center;justify-content:center;gap:20px;
  padding:12px 14px;border-top:1px solid var(--line);
  background:var(--paper);flex:none;
}
.pdf-nav button{
  appearance:none;border:none;background:var(--cyan);
  color:#04222B;width:46px;height:46px;border-radius:50%;
  font-size:1.3rem;font-weight:700;cursor:pointer;
  box-shadow:0 4px 14px rgba(14,165,196,.45);
  transition:background .15s ease, transform .15s ease, box-shadow .15s ease;
}
.pdf-nav button:hover:not(:disabled){background:#12b7d8;transform:translateY(-1px)}
.pdf-nav button:disabled{opacity:.3;cursor:default;background:var(--line);color:var(--muted);box-shadow:none}
.pdf-nav .pdf-page-info{font-size:.85rem;color:var(--muted);min-width:64px;text-align:center}
.pdf-nav{position:relative}
.pdf-next-wrap{position:relative;display:inline-flex}
.pdf-tutorial-hint{
  position:absolute;
  bottom:calc(100% + 8px);
  left:50%;
  transform:translateX(-50%) translateY(4px);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  pointer-events:none;
  opacity:0;
  transition:opacity .3s ease, transform .3s ease;
  z-index:5;
}
.pdf-tutorial-hint.show{opacity:1;transform:translateX(-50%) translateY(0)}
.pdf-tutorial-hint-text{
  background:#FF6B4A;color:#fff;font-size:.76rem;font-weight:700;
  white-space:nowrap;padding:6px 12px;border-radius:10px;
  box-shadow:0 6px 16px rgba(255,107,74,.45);
}
.pdf-tutorial-hint-arrow{
  width:18px;height:26px;color:#FF6B4A;flex:none;
  animation:pdfTutorialNudge 1.3s ease-in-out infinite;
}
@keyframes pdfTutorialNudge{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(5px)}
}
@media (prefers-reduced-motion: reduce){
  .pdf-tutorial-hint-arrow{animation:none}
  .pdf-tutorial-hint{transition:none}
}
body.pdf-modal-open{overflow:hidden}
@media (max-width:700px){
  .pdf-modal-panel{width:100vw;height:100vh;height:100dvh;margin:0;border-radius:0}
}
@media (prefers-reduced-motion: reduce){
  .pdf-modal, .pdf-modal-panel{transition:none}
}

.float-order-group{
  position:fixed;
  bottom:calc(20px + env(safe-area-inset-bottom,0px));
  left:50%;
  transform:translateX(-50%);
  z-index:150;
  display:inline-flex;align-items:center;gap:10px;
  direction:ltr;
  transition:opacity .25s ease, transform .25s ease;
}
.float-order-group.is-hidden{opacity:0;transform:translateX(-50%) translateY(14px) scale(.94);pointer-events:none}
body.pdf-modal-open .float-order-group{
  opacity:0;
  pointer-events:none;
  transform:translateX(-50%) scale(.5);
}
.float-order{
  position:relative;
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 22px;border-radius:999px;
  font-weight:700;font-size:.92rem;text-decoration:none;white-space:nowrap;
  background:var(--cyan);color:#04222B;
  box-shadow:0 4px 20px rgba(14,165,196,.4);
  animation:floatPulse 2.6s ease-in-out infinite;
  transition:background .18s ease, transform .18s ease, box-shadow .18s ease;
}
.float-order:hover{background:#12b7d8;transform:translateY(-2px)}
.float-order .cart-icon{width:18px;height:18px;flex:none}
@keyframes floatPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(14,165,196,.55), 0 4px 20px rgba(14,165,196,.4);}
  50%{box-shadow:0 0 0 13px rgba(14,165,196,0), 0 4px 20px rgba(14,165,196,.55);}
}
@media (prefers-reduced-motion: reduce){.float-order{animation:none}}
.trial-hint{
  position:absolute;
  bottom:calc(100% + 14px);
  left:50%;
  transform:translateX(-50%) rotate(-3deg);
  display:flex;flex-direction:column;align-items:center;
  pointer-events:none;
  animation:hintBounce 1.9s ease-in-out infinite;
}
.trial-hint-text{
  background:#FF6B4A;color:#fff;
  font-size:.76rem;font-weight:700;white-space:nowrap;
  padding:7px 13px;border-radius:10px;
  box-shadow:0 6px 16px rgba(255,107,74,.45);
}
.trial-hint-arrow{width:26px;height:22px;color:#FF6B4A;margin-top:2px;transform:rotate(4deg)}
@keyframes hintBounce{
  0%,100%{transform:translateX(-50%) rotate(-3deg) translateY(0)}
  50%{transform:translateX(-50%) rotate(-3deg) translateY(-6px)}
}
@media (prefers-reduced-motion: reduce){.trial-hint{animation:none}}
@media (max-width:600px){
  .trial-hint-text{font-size:.7rem;padding:6px 11px}

function buildGate(){
  const box = document.getElementById('langs');
  box.innerHTML = Object.entries(LANGS).map(([code,l])=>
    `<button class="lang-btn" data-lang="${code}">
       <span class="native">${l.native}</span>
       <span class="sub">${l.flag}</span>
     </button>`).join('');
  box.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',()=>enter(b.dataset.lang)));
}

function buildSwitcher(el){
  el.innerHTML = Object.entries(LANGS).map(([code,l])=>
    `<button data-lang="${code}">${l.flag}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
}

function setLang(code){
  current = code;
  const t = T[code], l = LANGS[code];
  document.documentElement.lang = code;
  document.documentElement.dir = l.dir;
  document.body.classList.toggle('lang-ar', code==='ar');
  document.querySelectorAll('[data-t]').forEach(el=>{
    const key = el.dataset.t;
    if(t[key]!==undefined) el.textContent = t[key];
  });
  document.getElementById('benefits').innerHTML = [
    ['leaf','b1t','b1'],['shield','b2t','b2'],['coin','b3t','b3'],['heart','b4t','b4']
  ].map(([icon,tt,tx])=>`<div class="item">${ICONS[icon]}<p><b>${t[tt]}</b>${t[tx]}</p></div>`).join('');
  document.getElementById('steps').innerHTML = [
    ['1','s1t','s1'],['2','s2t','s2'],['3','s3t','s3']
  ].map(([n,tt,tx])=>`<div class="step"><span class="num">${n}</span><h3>${t[tt]}</h3><p>${t[tx]}</p></div>`).join('');
  document.getElementById('direct').innerHTML =
    `<p style="margin:0 0 4px;color:#BFE0E7;font-size:.9rem">${t.directNote}</p>
     <a href="${CONTACT.whatsapp}" target="_blank" rel="noopener">WhatsApp</a>
     <a href="mailto:${CONTACT.email}">${CONTACT.email}</a>`;
  const pdfLink = document.getElementById('pdfLink');
  const pdfUrl = PDF_URLS[code] || PDF_URLS.en;
  if(pdfLink) pdfLink.href = pdfUrl;
  if(typeof pdfModal !== 'undefined' && pdfModal && pdfModal.classList.contains('open') && pdfCurrentUrl !== pdfUrl){
    loadPdfInto(pdfUrl);
  }
  [document.getElementById('switcher-top'), document.getElementById('switcher-bottom')].forEach(el=>{
    el.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current', b.dataset.lang===code ? 'true':'false'));
  });
  const form = document.getElementById('orderForm');
  form.classList.remove('sent');
  document.getElementById('confirm').classList.remove('show');
  updateFormValidationMessages(t);
  applyOrderMode(orderMode);
}

function applyOrderMode(mode){
  orderMode = mode;
  const t = T[current] || T.en;
  const modesBox = document.getElementById('orderModes');
  if(modesBox){
    modesBox.querySelectorAll('.order-mode-btn').forEach(function(b){
      b.classList.toggle('active', b.dataset.mode === mode);
    });
  }
  const titleEl = document.getElementById('orderTitleEl');
  const copyEl = document.getElementById('orderCopyEl');
  if(titleEl) titleEl.textContent = mode === 'trial' ? t.orderTitleTrial : t.orderTitleOrder;
  if(copyEl) copyEl.textContent = mode === 'trial' ? t.orderCopyTrial : t.orderCopyOrder;
  const eligField = document.getElementById('eligibilityField');
  if(eligField){
    const eligInput = eligField.querySelector('input');
    if(mode === 'trial'){
      eligField.style.display = '';
      if(eligInput) eligInput.required = true;
    } else {
      eligField.style.display = 'none';
      if(eligInput){ eligInput.required = false; eligInput.checked = false; eligInput.setCustomValidity(''); }
    }
  }
}

function updateFormValidationMessages(t){
  const form = document.getElementById('orderForm');
  if(!form) return;
  form.querySelectorAll('input').forEach(input=>{
    input.dataset.errRequired = t.errRequired;
    input.dataset.errPhone = t.errPhone || t.errRequired;
    input.dataset.errEligibility = t.errEligibility || t.errRequired;
  });
}

function wireCustomValidation(){
  const form = document.getElementById('orderForm');
  if(!form) return;
  form.querySelectorAll('input').forEach(input=>{
    input.addEventListener('invalid', function(){
      if(input.validity.valueMissing){
        if(input.type === 'checkbox'){
          input.setCustomValidity(input.dataset.errEligibility || input.dataset.errRequired || 'Please fill out this field.');
        } else {
          input.setCustomValidity(input.dataset.errRequired || 'Please fill out this field.');
        }
      } else if(input.validity.typeMismatch || input.validity.patternMismatch){
        input.setCustomValidity(input.dataset.errPhone || input.dataset.errRequired || '');
      } else {
        input.setCustomValidity('');
      }
    });
    input.addEventListener('input', function(){
      input.setCustomValidity('');
    });
    input.addEventListener('change', function(){
      input.setCustomValidity('');
    });
  });
}

function setupFloatObserver(){
  if(window.__floatObsInit) return;
  window.__floatObsInit = true;
  const orderSection = document.getElementById('order');
  const floatGroup = document.getElementById('floatOrderGroup');
  if(!orderSection || !floatGroup || !('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(([entry])=>{
    floatGroup.classList.toggle('is-hidden', entry.isIntersecting);
  }, {threshold:0.3});
  io.observe(orderSection);
}

function enter(code){
  setLang(code);
  document.getElementById('gate').classList.add('hide');
  document.getElementById('site').classList.add('show');
  window.scrollTo(0,0);
  setupFloatObserver();
  try{ history.replaceState(null,'','#'+code); }catch(e){}
}

const pdfModal = document.getElementById('pdfModal');

const pdfNextBtn = document.getElementById('pdfNext');

const pdfTutorialHint = document.getElementById('pdfTutorialHint');
let pdfLastFocused = null;
let pdfDoc = null;
let pdfPageNum = 1;
let pdfPageCount = 0;
let pdfRendering = false;
let pdfPendingPage = null;
let pdfCurrentUrl = null;
let pdfTutorialShown = false;
let pdfTutorialTimer = null;

function hidePdfTutorialHint(){
  if(pdfTutorialHint) pdfTutorialHint.classList.remove('show');
  if(pdfTutorialTimer){ clearTimeout(pdfTutorialTimer); pdfTutorialTimer = null; }
}

function showPdfTutorialHint(){
  if(!pdfTutorialHint || pdfTutorialShown) return;
  pdfTutorialShown = true;
  setTimeout(function(){
    if(pdfTutorialHint) pdfTutorialHint.classList.add('show');
    pdfTutorialTimer = setTimeout(hidePdfTutorialHint, 4200);
  }, 500);
}

function updatePdfNav(){
  if(pdfPageInfo) pdfPageInfo.textContent = pdfPageCount ? (pdfPageNum + ' / ' + pdfPageCount) : '';
  if(pdfPrevBtn) pdfPrevBtn.disabled = !pdfDoc || pdfPageNum<=1;
  if(pdfNextBtn) pdfNextBtn.disabled = !pdfDoc || pdfPageNum>=pdfPageCount;
}

function renderPdfPage(num){
  if(!pdfDoc) return;
  pdfRendering = true;
  pdfDoc.getPage(num).then(function(page){
    const containerWidth = Math.max(200, (pdfViewerBody ? pdfViewerBody.clientWidth : 600) - 36);
    const baseViewport = page.getViewport({scale:1});
    const scale = Math.min(2.2, containerWidth / baseViewport.width);
    const viewport = page.getViewport({scale: scale});
    pdfCanvas.classList.remove('loaded');
    pdfCanvas.width = viewport.width;
    pdfCanvas.height = viewport.height;
    const ctx = pdfCanvas.getContext('2d');
    const renderTask = page.render({canvasContext: ctx, viewport: viewport});
    renderTask.promise.then(function(){
      pdfRendering = false;
      pdfCanvas.style.display = 'block';
      if(pdfLoading) pdfLoading.style.display = 'none';
      requestAnimationFrame(function(){ pdfCanvas.classList.add('loaded'); });
      if(pdfViewerBody) pdfViewerBody.scrollTop = 0;
      if(pdfPendingPage !== null){
        const next = pdfPendingPage;
        pdfPendingPage = null;
        renderPdfPage(next);
      }
    });
  });
  pdfPageNum = num;
  updatePdfNav();
}

function queueRenderPage(num){
  if(pdfRendering){ pdfPendingPage = num; } else { renderPdfPage(num); }
}

function loadPdfInto(url){
  pdfCurrentUrl = url;
  pdfDoc = null;
  pdfPageCount = 0;
  pdfPageNum = 1;
  if(pdfCanvas){ pdfCanvas.style.display = 'none'; pdfCanvas.classList.remove('loaded'); }
  if(pdfLoading){ pdfLoading.style.display = 'block'; pdfLoading.textContent = 'Loading…'; }
  updatePdfNav();
  if(pdfDownloadLink) pdfDownloadLink.href = url;
  if(!window.pdfjsLib){
    if(pdfLoading) pdfLoading.textContent = 'Could not load the viewer.';
    return;
  }
  pdfjsLib.getDocument(url).promise.then(function(doc){
    if(pdfCurrentUrl !== url) return;
    pdfDoc = doc;
    pdfPageCount = doc.numPages;
    renderPdfPage(1);
  }).catch(function(){
    if(pdfLoading) pdfLoading.textContent = 'Could not load the PDF.';
  });
}

function openPdfModal(url){
  if(!pdfModal || !url) return;
  pdfLastFocused = document.activeElement;
  pdfModal.classList.add('open');
  pdfModal.setAttribute('aria-hidden','false');
  document.body.classList.add('pdf-modal-open');
  loadPdfInto(url);
  showPdfTutorialHint();
  const closeBtn = pdfModal.querySelector('.pdf-modal-close');
  if(closeBtn) closeBtn.focus();
}

function closePdfModal(){
  if(!pdfModal || !pdfModal.classList.contains('open')) return;
  pdfModal.classList.remove('open');
  pdfModal.setAttribute('aria-hidden','true');
  document.body.classList.remove('pdf-modal-open');
  pdfCurrentUrl = null;
  pdfDoc = null;
  hidePdfTutorialHint();
  if(pdfLastFocused && pdfLastFocused.focus) pdfLastFocused.focus();
}

if(pdfPrevBtn) pdfPrevBtn.addEventListener('click', function(){
  hidePdfTutorialHint();
  if(!pdfDoc || pdfPageNum<=1) return;
  queueRenderPage(pdfPageNum-1);
});
if(pdfNextBtn) pdfNextBtn.addEventListener('click', function(){
  hidePdfTutorialHint();
  if(!pdfDoc || pdfPageNum>=pdfPageCount) return;
  queueRenderPage(pdfPageNum+1);
});

document.getElementById('pdfLink').addEventListener('click', function(e){

    if(e.key === 'Escape' && pdfModal.classList.contains('open')) closePdfModal();
